<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Portfolio image compositions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;font:500 26px Arial,sans-serif;color:#13253b}main{position:relative;width:1440px;height:1080px;overflow:hidden;background:#fff}.base{position:absolute;width:1440px;height:1080px;object-fit:contain}.card{position:absolute;width:208px;height:164px;background:linear-gradient(145deg,#fff,#f5f8fc);border:1px solid #dbe4ed;border-radius:22px;box-shadow:0 15px 28px #12365319,0 2px 2px #fff inset;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:3}.card img{width:76px;height:76px;object-fit:contain}.card span{font-size:24px;letter-spacing:-.6px}.lines{z-index:2;position:absolute;inset:0;width:100%;height:100%}.center{position:absolute;width:630px;left:405px;top:300px;z-index:1}.cloud-label{position:absolute;top:785px;left:530px;width:380px;text-align:center;font-size:25px;letter-spacing:5px;color:#416381}.monitor{position:absolute;left:45px;top:90px;width:1130px;padding:16px 16px 30px;border-radius:25px;background:linear-gradient(135deg,#444b53,#0b1018 25%,#1c2533 75%,#77808a);box-shadow:15px 30px 45px #18354e29;transform:perspective(1800px) rotateY(6deg) rotateZ(-2deg)}.monitor img{display:block;width:100%;border-radius:8px}.stand{position:absolute;left:400px;top:870px;width:310px;height:100px;background:linear-gradient(100deg,#aeb4bc,#e5e8ed 50%,#7d8794);clip-path:polygon(35% 0,68% 0,77% 83%,100% 92%,100% 100%,0 100%,0 92%,24% 83%)}.panel{position:absolute;left:750px;top:555px;width:620px;padding:12px;border-radius:18px;background:#f8fafc;box-shadow:0 26px 58px #071a3d40,0 0 0 1px #c5cfdf;transform:perspective(1700px) rotateY(-9deg) rotateZ(3deg)}.panel img{display:block;width:100%;border-radius:7px}.bar{height:27px;display:flex;gap:6px;align-items:center;padding-bottom:8px}.bar i{width:7px;height:7px;background:#90a6bc;border-radius:50%}.bar span{font-size:12px;margin:auto;color:#54667c;letter-spacing:1px}
</style>
<main id="scene"></main>
<script>
const scene=document.getElementById('scene'),id=new URLSearchParams(location.search).get('scene');
const card=(icon,label,x,y)=>`<div class="card" style="left:${x}px;top:${y}px"><img src="${icon}.svg" alt=""><span>${label}</span></div>`;
if(id==='xome'){
 scene.innerHTML='<img class="base" src="xome-workstation.webp" alt="">'+`<svg class="lines" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#3e83c9" stroke-width="1.5"/></marker></defs><g stroke="#79a9d8" stroke-width="4" marker-end="url(#a)" fill="none"><path d="M308 124H412"/><path d="M638 124H742"/><path d="M968 124H1072"/></g></svg>`+[['azuredevops','Azure DevOps'],['docker','Docker'],['kubernetes','Kubernetes'],['azure','Microsoft Azure']].map(([icon,label],i)=>card(icon,label,90+i*330,40)).join('');
}else if(id==='skills'){
 const nodes=[['azuredevops','Azure DevOps',170,70],['git','Git',616,25],['githubactions','GitHub Actions',1062,70],['docker','Docker',35,425],['kubernetes','Kubernetes',1197,425],['powershell','PowerShell',170,800],['python','Python',616,870],['azure','Microsoft Azure',1062,800]];
 const paths=nodes.map(([, ,x,y])=>{const sx=x+104,sy=y+82,dx=sx-720,dy=sy-550,k=1/Math.sqrt(dx*dx/(285*285)+dy*dy/(220*220));return `<path d="M${sx} ${sy}L${720+dx*k} ${550+dy*k}"/>`}).join('');
 scene.innerHTML=`<svg class="lines" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#4c8fc8" stroke-width="1.5"/></marker></defs><g fill="none" stroke="#87b1d9" stroke-width="3" marker-end="url(#a)">${paths}</g></svg><img class="center" src="../hero-1440.webp" alt="">`+nodes.map(([icon,label,x,y])=>card(icon,label,x,y)).join('');
}else if(id==='cloudveyra'){
 scene.innerHTML='<div class="stand"></div><div class="monitor"><img src="cloudveyra-resources.webp" alt="Actual CloudVeyra resource dashboard"></div><div class="panel"><div class="bar"><i></i><i></i><i></i><span>CLOUDVEYRA · KUBERNETES DEMO</span></div><img src="cloudveyra-cluster.webp" alt="Actual CloudVeyra Kubernetes simulation"></div>';
}
</script></html>
