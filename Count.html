<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marvel Countdown</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    overflow-x:hidden;
    color:white;
    min-height:100vh;
}

.video-background{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;
    background:black;
}

.video-background iframe{
    position:absolute;
    top:50%;
    left:50%;
    width:120vw;
    height:67.5vw;
    min-width:177.77vh;
    min-height:100vh;
    transform:translate(-50%, -50%);
    pointer-events:none;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.28);
    z-index:-4;
}

.navbar{
    height:70px;
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 50px;
    position:sticky;
    top:0;
    z-index:999;
}

.logo{font-size:32px;font-weight:800}

.nav-links{
    display:flex;
    gap:45px;
    color:#ddd;
}

.app-layout{
    min-height:calc(100vh - 70px);
    display:grid;
    grid-template-columns:1fr 430px;
    gap:30px;
    padding:50px;
}

.left-panel{
    max-width:720px;
    align-self:center;
}

.left-panel h1{
    font-size:76px;
    line-height:0.95;
    letter-spacing:-4px;
    text-shadow:0 12px 35px rgba(0,0,0,0.5);
}

.left-panel p{
    margin-top:22px;
    font-size:22px;
    color:#e8e8e8;
}

.primary-btn{
    margin-top:34px;
    width:auto;
    padding:16px 26px;
    border:none;
    border-radius:999px;
    background:white;
    color:#111;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.side-panel{
    height:calc(100vh - 170px);
    overflow-y:auto;
    padding:24px;
    border-radius:30px;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.side-title{
    font-size:28px;
    margin-bottom:20px;
}

.timer-list{
    display:grid;
    gap:18px;
}

.timer-card{
    padding:20px;
    border-radius:22px;
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.15);
}

.timer-card h3{
    font-size:22px;
    margin-bottom:6px;
}

.timer-card p{
    color:#ddd;
    font-size:13px;
}

.time-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:18px;
    text-align:center;
}

.time-box{
    background:rgba(255,255,255,0.12);
    border-radius:14px;
    padding:10px 4px;
}

.time-box strong{
    font-size:24px;
    display:block;
}

.time-box span{
    font-size:10px;
    color:#ccc;
}

.timer-footer{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:#ddd;
}

.delete-btn{
    border:none;
    background:none;
    color:#ff5a66;
    font-size:14px;
    cursor:pointer;
}

.sound-btn,.next-btn{
    position:fixed;
    right:24px;
    z-index:99999;
    width:auto;
    padding:12px 20px;
    border:none;
    border-radius:999px;
    background:rgba(0,0,0,0.85);
    color:white;
    font-size:16px;
    cursor:pointer;
}

.sound-btn{bottom:24px}
.next-btn{bottom:80px}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:460px;
    padding:32px;
    border-radius:28px;
    background:rgba(20,20,20,0.92);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 20px 80px rgba(0,0,0,0.6);
}

.modal-card h2{
    font-size:32px;
    margin-bottom:22px;
}

.input-box{
    width:100%;
    height:58px;
    border-radius:16px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    padding:0 18px;
    margin-bottom:16px;
}

.input-box span{
    margin-right:12px;
}

input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:17px;
}

input::placeholder{color:#ccc}

.modal-actions{
    display:flex;
    gap:12px;
    margin-top:10px;
}

.cancel-btn,.save-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-size:16px;
}

.cancel-btn{
    background:rgba(255,255,255,0.14);
    color:white;
}

.save-btn{
    background:white;
    color:#111;
    font-weight:700;
}

.empty{
    color:#ddd;
    font-size:15px;
    line-height:1.5;
}

@media(max-width:900px){
    .app-layout{
        grid-template-columns:1fr;
        padding:30px 20px;
    }

    .left-panel h1{
        font-size:48px;
    }

    .side-panel{
        height:auto;
        max-height:none;
    }

    .nav-links{
        display:none;
    }

    .navbar{
        padding:0 24px;
    }
}
</style>
</head>

<body>

<div class="video-background">
<iframe
id="ytplayer"
src="https://www.youtube.com/embed/videoseries?list=PLBIe-tav3LqBikbU6lgKfDOlJMWDfKquw&autoplay=1&mute=1&playsinline=1&controls=1&loop=1&shuffle=1&enablejsapi=1&rel=0"
frameborder="0"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>
</div>

<div class="video-overlay"></div>

<button class="sound-btn" onclick="turnSoundOn()">🔊 Sound On</button>
<button class="next-btn" onclick="nextVideo()">⏭ Next</button>

<div class="navbar">
    <div class="logo">⚡</div>
    <div class="nav-links">
        <span>Timers</span>
        <span>Marvel</span>
        <span>Infinity</span>
        <span>Multiverse</span>
    </div>
    <div>☼</div>
</div>

<main class="app-layout">
    <section class="left-panel">
        
        <button class="primary-btn" onclick="openModal()">＋ Add Timer</button>
    </section>

    <aside class="side-panel">
        <h2 class="side-title">Active Timers</h2>
        <div class="timer-list" id="timerList"></div>
    </aside>
</main>

<div class="modal" id="timerModal">
    <div class="modal-card">
        <h2>Add Timer</h2>

        <div class="input-box">
            <span>◷</span>
            <input type="text" id="timerName" placeholder="Enter timer name">
        </div>

        <div class="input-box">
            <span>◫</span>
            <input type="datetime-local" id="timerDate">
        </div>

        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="save-btn" onclick="addTimer()">Save Timer</button>
        </div>
    </div>
</div>

<script>
let timers = JSON.parse(localStorage.getItem("timers")) || [];

function openModal(){
    document.getElementById("timerModal").classList.add("show");
}

function closeModal(){
    document.getElementById("timerModal").classList.remove("show");
}

function addTimer(){
    const name = document.getElementById("timerName").value.trim();
    const date = document.getElementById("timerDate").value;

    if(!name || !date){
        alert("Please enter both fields");
        return;
    }

    timers.push({
        name,
        targetDate:new Date(date).getTime(),
        created:new Date().toLocaleDateString()
    });

    localStorage.setItem("timers", JSON.stringify(timers));

    document.getElementById("timerName").value="";
    document.getElementById("timerDate").value="";

    closeModal();
    renderTimers();
}

function deleteTimer(index){
    timers.splice(index,1);
    localStorage.setItem("timers", JSON.stringify(timers));
    renderTimers();
}

function getRemaining(target){
    const now = new Date().getTime();
    let diff = Math.floor((target-now)/1000);
    if(diff < 0) diff = 0;

    return{
        days:Math.floor(diff/86400),
        hours:Math.floor((diff%86400)/3600),
        minutes:Math.floor((diff%3600)/60),
        seconds:diff%60,
        total:diff
    };
}

function pad(n){
    return String(n).padStart(2,"0");
}

function renderTimers(){
    const container = document.getElementById("timerList");
    container.innerHTML="";

    if(timers.length === 0){
        container.innerHTML = `<p class="empty">No timers yet. Click Add Timer to create your first one.</p>`;
        return;
    }

    timers.forEach((timer,index)=>{
        const r = getRemaining(timer.targetDate);
        const div = document.createElement("div");

        div.className="timer-card";

        div.innerHTML=`
        <h3>${timer.name}</h3>
        <p>Created on ${timer.created}</p>

        <div class="time-grid">
            <div class="time-box">
                <strong>${pad(r.days)}</strong>
                <span>DAYS</span>
            </div>
            <div class="time-box">
                <strong>${pad(r.hours)}</strong>
                <span>HRS</span>
            </div>
            <div class="time-box">
                <strong>${pad(r.minutes)}</strong>
                <span>MIN</span>
            </div>
            <div class="time-box">
                <strong>${pad(r.seconds)}</strong>
                <span>SEC</span>
            </div>
        </div>

        <div class="timer-footer">
            <div>Total: <b>${r.total}</b>s</div>
            <button class="delete-btn" onclick="deleteTimer(${index})">Delete</button>
        </div>
        `;

        container.appendChild(div);
    });
}

function turnSoundOn(){
    const iframe = document.getElementById("ytplayer");

    iframe.contentWindow.postMessage(JSON.stringify({
        event:"command",
        func:"unMute",
        args:[]
    }), "*");

    iframe.contentWindow.postMessage(JSON.stringify({
        event:"command",
        func:"setVolume",
        args:[100]
    }), "*");
}

function nextVideo(){
    const iframe = document.getElementById("ytplayer");

    iframe.contentWindow.postMessage(JSON.stringify({
        event:"command",
        func:"nextVideo",
        args:[]
    }), "*");
}

setInterval(renderTimers,1000);
renderTimers();
</script>

</body>
</html>
